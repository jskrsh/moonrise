name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: build
        run: ./gradlew build
